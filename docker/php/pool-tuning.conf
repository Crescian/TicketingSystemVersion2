; Overrides the base php:8.3-fpm image's stock pool defaults (max_children=5),
; sized for this app's container: 4 CPUs, no memory limit, ~35-60MB per
; worker observed in practice. 20 workers is comfortable headroom for
; ~500 users/day without risking host memory under a traffic burst.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
