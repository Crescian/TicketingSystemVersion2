; Matches the app's own attachment validation (up to 5 files, 10MB each —
; see 'attachments.*' => 'max:10240' in TicketsController@store and the
; Technician/Admin service-report resolve() flows). Without this, PHP's
; stock defaults (upload_max_filesize=2M, post_max_size=8M) silently cap
; uploads well below what the app itself allows and advertises to users.
upload_max_filesize = 12M
post_max_size = 55M
max_file_uploads = 20
