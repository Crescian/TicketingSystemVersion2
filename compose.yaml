services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: ticketing_app
        volumes:
            - .:/var/www/html
        expose:
            - "9000"
        networks:
            - ticketing # ← ADD THIS

    queue-worker:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: ticketing_queue_worker
        command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
        volumes:
            - .:/var/www/html
        networks:
            - ticketing
        depends_on:
            - pgsql
            - redis
        restart: unless-stopped

    redis:
        image: redis:latest
        container_name: ticketing_redis
        command:
            ["redis-server", "--appendonly", "yes", "--requirepass", "cmlinux"]
        networks:
            - ticketing
        restart: unless-stopped

    pgsql:
        image: postgres:16.3
        container_name: ticketing_pgsql
        environment:
            POSTGRES_DB: ticketing_system
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: leonio
        # Named volume ensures DB persists after container is removed
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - "5434:5432" # ← ADD THIS (unique port per DB)
        networks:
            - ticketing
        restart: unless-stopped

networks:
    ticketing:
        driver: bridge

volumes:
    pgdata:
