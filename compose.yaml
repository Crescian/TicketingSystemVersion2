services:
    app_1:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: ticketing_app_1
        volumes:
            - .:/var/www/html
        expose:
            - "9000"
        networks:
            - ticketing
            - shared_services_net
        restart: unless-stopped

    app_2:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: ticketing_app_2
        volumes:
            - .:/var/www/html
        expose:
            - "9000"
        networks:
            - ticketing
            - shared_services_net
        restart: unless-stopped

    queue-worker:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: ticketing_queue_worker
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        user: "33:33"
        volumes:
            - .:/var/www/html
        networks:
            - ticketing
            - shared_services_net
        restart: unless-stopped
        depends_on:
            - pgsql
            - redis

    redis:
        image: redis:latest
        container_name: ticketing_redis
        command:
            ["redis-server", "--appendonly", "yes", "--requirepass", "cmlinux"]
        networks:
            - ticketing
        restart: unless-stopped

    pgsql:
        image: postgres:16.3
        container_name: ticketing_pgsql
        environment:
            POSTGRES_DB: ticketing_system
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: leonio
        # Named volume ensures DB persists after container is removed
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - "127.0.0.1:5436:5432" # localhost-only — pgAdmin via WSL2's localhost forwarding still works, network access does not
        networks:
            - ticketing
        restart: unless-stopped

networks:
    ticketing:
        driver: bridge
    shared_services_net:
        external: true

volumes:
    pgdata:
